name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-and-release:
    name: Build Web App & Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Web Bundle
        run: npm run build

      - name: Package Standalone Web Portable ZIP
        run: |
          cd dist
          zip -r ../open-stage-setlist-web-standalone.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Open Stage Setlist ${{ github.ref_name }}
          body: |
            ## 🎹 Open Stage Setlist — ${{ github.ref_name }}
            
            ### ✨ What's Included:
            - **Web Standalone Bundle (`open-stage-setlist-web-standalone.zip`)**: Run offline in any modern browser without an active internet connection.
            - **Pure OLED Pitch Black Mode (`#000000`)**
            - **Custom Themes & Segmented Controls**
            - **Live Stage Intermission Screen**
            - **Intelligent Guitar & Piano Chord Visualizers**
            - **Repertoire Markdown (.md) Export & JSON Backup**
          files: |
            open-stage-setlist-web-standalone.zip
